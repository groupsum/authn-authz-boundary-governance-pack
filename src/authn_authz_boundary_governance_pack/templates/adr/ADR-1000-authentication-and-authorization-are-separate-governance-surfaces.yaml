  "slug": "authentication-and-authorization-are-separate-governance-surfaces",
  "title": "Authentication And Authorization Are Separate Governance Surfaces",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Authentication establishes identity facts; authorization independently decides whether those facts permit a resource action.",
  "body": "Repositories must define an explicit handoff between authentication and authorization. The authentication surface produces validated identity and authentication-event facts, including the stable subject identifier, issuer, audience, authentication time, and assurance or method indicators when applicable. The authorization surface may consume those facts as policy inputs only after validating their provenance, freshness, audience, and integrity. Successful authentication, possession of an identity token, or presence of an identity claim must never be treated as an allow decision. Authorization must not reinterpret or inflate authentication assurance. Each surface retains separate ownership, failure handling, audit evidence, and release claims; detailed controls remain governed by the dedicated authentication and authorization packs.",
  "decision_date": "2026-06-02",
