  "slug": "authn-authz-boundary-contract",
  "title": "AuthN AuthZ Boundary Contract",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Defines the governed handoff of validated authentication facts into independent authorization decisions.",
  "body": "A conforming repository declares the authentication producer, authorization consumer, and trust boundary between them. It documents the accepted identity artifact, stable subject identifier, issuer and audience constraints, integrity validation, freshness and replay controls, authentication time, assurance and method fields, normalization rules, and behavior when any required fact is missing or invalid. The handoff must preserve provenance and tenant context, minimize disclosed identity data, and fail closed before policy evaluation when validation fails. The authorization component must combine accepted authentication facts with an explicit action, resource, and runtime context to produce its own allow or deny decision. Tests and evidence must separately demonstrate authentication-artifact rejection, boundary mapping, and denial when authentication succeeds but authorization does not grant the requested action. Detailed authenticator, session, permission, entitlement, policy-engine, and enforcement requirements are outside this boundary contract and remain owned by their dedicated governance packs.",
  "decision_date": "2026-06-02",
