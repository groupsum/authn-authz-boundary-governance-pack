  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Defines access-token validation requirements for resource servers.",
  "body": "A conforming resource server validates token issuer, audience, expiry, signature or introspection result, active status, token type, client context, scopes, and required claims before policy use. Validation failures must fail closed and must be logged with enough detail for audit.",
