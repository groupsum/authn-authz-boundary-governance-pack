  "title": "PIP And Attribute Sources Are Authoritative Inputs Not Hidden Logic",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Policy information sources must be declared as inputs rather than hidden authorization logic.",
  "body": "Repositories must identify sources for identity attributes, group membership, roles, entitlements, relationships, tenant data, device state, risk signals, and resource classifications. Missing, stale, or conflicting attributes must have defined authorization behavior.",
