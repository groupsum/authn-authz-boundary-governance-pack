  "title": "XACML Is A Reference Architecture Not A Required Policy Language",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "XACML vocabulary can govern PDP, PEP, PIP, PAP, obligations, and advice without requiring XML policy adoption.",
  "body": "Repositories may use XACML terminology and interoperability concepts as a reference architecture while implementing policies in another engine. Claims of XACML compatibility require explicit request, response, combining, obligation, and advice evidence.",
