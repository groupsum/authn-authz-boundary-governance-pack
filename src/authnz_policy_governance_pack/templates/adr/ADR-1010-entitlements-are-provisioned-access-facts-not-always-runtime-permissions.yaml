  "title": "Entitlements Are Provisioned Access Facts Not Always Runtime Permissions",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Entitlements are provisioned access facts that may map to roles, permissions, licenses, features, or policy inputs.",
  "body": "Repositories must distinguish provisioned entitlements from application-enforced permissions. Entitlement assignment, removal, review, and synchronization must be traceable to authoritative identity or governance systems before being used as runtime access inputs.",
