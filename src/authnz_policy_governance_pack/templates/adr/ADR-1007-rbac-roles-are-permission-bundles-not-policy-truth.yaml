  "title": "RBAC Roles Are Permission Bundles Not Policy Truth",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Roles are governed permission bundles or policy attributes, not the complete truth of authorization.",
  "body": "Repositories may use roles to simplify assignment and review, but role membership must map to explicit permissions or policy inputs. Privileged roles, inherited roles, role conflicts, and separation-of-duties rules require explicit governance.",
