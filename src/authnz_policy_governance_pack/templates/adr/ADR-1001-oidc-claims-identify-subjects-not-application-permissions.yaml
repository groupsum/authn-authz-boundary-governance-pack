  "title": "OIDC Claims Identify Subjects Not Application Permissions",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "OIDC ID Token and UserInfo claims are identity assertions, not direct application permissions.",
  "body": "Repositories must treat OIDC claims as asserted facts about a subject, authentication event, or identity provider context. Application permission checks must be performed by an authorization policy, permission mapping, or resource decision process rather than by trusting claim presence alone.",
