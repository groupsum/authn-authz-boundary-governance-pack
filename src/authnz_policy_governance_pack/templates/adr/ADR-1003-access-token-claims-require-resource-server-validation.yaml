  "title": "Access Token Claims Require Resource Server Validation",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Access tokens and token claims require resource-server validation before authorization use.",
  "body": "Resource servers must validate issuer, audience, expiration, signature or introspection state, token type, client context, scopes, and relevant claims before using token content as policy input. Unvalidated token content must not grant access.",
