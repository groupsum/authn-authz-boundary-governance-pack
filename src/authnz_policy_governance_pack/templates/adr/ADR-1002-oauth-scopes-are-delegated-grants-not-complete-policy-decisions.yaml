  "title": "OAuth Scopes Are Delegated Grants Not Complete Policy Decisions",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "OAuth scopes express delegated grant breadth and must not be treated as complete object-level authorization.",
  "body": "Repositories must distinguish authorization-server grants from runtime resource decisions. Scope checks may be required before policy evaluation, but fine-grained permissions, tenant isolation, ownership, relationship, and contextual decisions require explicit authorization logic.",
  "decision_date": "2026-06-02",
