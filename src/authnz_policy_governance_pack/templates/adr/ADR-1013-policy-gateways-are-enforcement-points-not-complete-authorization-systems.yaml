  "title": "Policy Gateways Are Enforcement Points Not Complete Authorization Systems",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Gateways, sidecars, middleware, and meshes are enforcement points and must not replace required object-level authorization.",
  "body": "Repositories using a policy gateway must define what the gateway enforces, what the application still enforces, how bypass is prevented, and how gateway decisions are correlated with downstream object-level authorization evidence.",
