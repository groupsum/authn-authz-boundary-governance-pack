  "title": "Authentication And Authorization Are Separate Governance Surfaces",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Identity proof, login state, token issuance, delegated authorization, and resource authorization are governed as separate surfaces.",
  "body": "Repositories must declare authentication, OAuth token issuance, session management, and application authorization as distinct responsibilities. Identity claims can inform authorization, but successful authentication is not sufficient proof that a subject may perform a resource action.",
  "decision_date": "2026-06-02",
