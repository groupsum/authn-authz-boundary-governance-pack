  "slug": "oidc-id-token-and-userinfo-claims-contract",
  "title": "OIDC ID Token And UserInfo Claims Contract",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Defines the validation, normalization, provenance, and authorization-boundary requirements for OIDC identity claims.",
  "body": "A conforming repository declares which ID Token and UserInfo claims may cross the AuthN/AuthZ boundary and the authority for each accepted claim. It validates issuer, subject, audience, signature, expiration and other applicable time constraints, nonce where applicable, authentication context, authentication methods, and custom-claim provenance before mapping claims into policy context. It documents normalization, tenant scoping, collision handling, data minimization, freshness, revalidation, and fail-closed behavior. ID Tokens remain authentication artifacts and must not be presented to resource servers as access tokens or treated as object-level authorization. Tests and evidence must cover invalid issuers and audiences, expired assertions, subject instability, unauthorized custom claims, tenant-boundary loss, and successful authentication followed by authorization denial.",
  "decision_date": "2026-06-02",
